[project]
name = "oslearn-vm"
version = "0.1.0"
description = "A tiny concurrent pseudo-code VM for the OS course (.os files)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
vm = "vm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vm"]

[dependency-groups]
dev = ["pytest>=8.0"]
